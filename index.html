<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="calculator">
            <header class="top-bar">
                <div class="brand">
                    <span class="brand-icon"></span>
                    <div>
                        <h1></h1>
                        <p>CALCULATOR</p>
                    </div>
                </div>
                <span class="status-dot" title="Calculator aktif"></span>
            </header>

            <section class="screen" aria-label="Layar kalkulator">
                <div id="previous-operand" class="previous-operand"></div>
                <div id="current-operand" class="current-operand">0</div>
            </section>

            <section class="keypad" aria-label="Tombol kalkulator">
                <button class="key key-function" data-action="clear">AC</button>
                <button class="key key-function" data-action="delete">DEL</button>
                <button class="key key-function" data-action="percent">%</button>
                <button class="key key-operator" data-operator="÷">÷</button>

                <button class="key" data-number="7">7</button>
                <button class="key" data-number="8">8</button>
                <button class="key" data-number="9">9</button>
                <button class="key key-operator" data-operator="×">×</button>

                <button class="key" data-number="4">4</button>
                <button class="key" data-number="5">5</button>
                <button class="key" data-number="6">6</button>
                <button class="key key-operator" data-operator="−">−</button>

                <button class="key" data-number="1">1</button>
                <button class="key" data-number="2">2</button>
                <button class="key" data-number="3">3</button>
                <button class="key key-operator" data-operator="+">+</button>

                <button class="key key-zero" data-number="0">0</button>
                <button class="key" data-action="decimal">.</button>
                <button class="key key-equals" data-action="calculate">=</button>
            </section>
            <footer class="calculator-footer"><span></span></footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
